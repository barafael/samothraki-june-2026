[workspace]
members = ["photo-extract"]
resolver = "2"

[package]
name = "my-holiday"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1"
dioxus = { version = "=0.7.9", features = ["fullstack"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

# Server-only (enabled by the `server` feature below).
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"], optional = true }
tokio = { version = "1", features = ["fs", "io-util", "sync"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", default-features = false, features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlScriptElement",
  "KeyboardEvent",
  "Node",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "Window",
] }

[features]
default = ["web"]

# Browser client (WASM). dx builds this half of the fullstack app with `web`.
web = ["dioxus/web"]

# Native server (what runs on fly.io, and locally under `dx serve`). Serves the
# app, the photo-data server functions, and the media routes (local files or
# proxied from GitHub Releases).
server = [
  "dioxus/server",
  "dep:base64",
  "dep:reqwest",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
]

[profile.release]
# No DWARF in release builds. The std debug info rustup ships would otherwise
# end up in the WASM, and the wasm-opt that dx 0.7.9 uses aborts on it
# ("unsupported version of DWARF"), leaving the bundle unoptimized.
strip = "debuginfo"
