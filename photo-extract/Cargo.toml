[package]
name = "photo-extract"
version = "0.1.0"
edition = "2021"

# Native build tools (never part of the app):
#   extract    -> re-reads EXIF/ffprobe metadata into assets/photo_data.json
#                 (from scratch: manual annotations are NOT preserved)
#   gen-media  -> web-sized JPEGs of the original photos, for GitHub Releases
#                 (driven by scripts/publish_media.sh)
[lib]
name = "photo_extract"
path = "src/lib.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "gen-media"
path = "src/bin/gen_media.rs"

[dependencies]
kamadak-exif = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
